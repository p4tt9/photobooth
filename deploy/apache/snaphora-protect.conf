# Interne Dateien nie über HTTP ausliefern – unabhängig davon, was in den Volumes liegt.
# (Die .htaccess-Dateien des Original-Projekts reichen nicht: config/, data/ und var/ sind Volumes,
# dort fehlen sie oder können fehlen.)

# Einstellungen (inkl. Ebenen vom Server) und Laufzeitdaten (Logs, Sperren)
<DirectoryMatch "^/app/(config|var)(/|$)">
    Require all denied
</DirectoryMatch>

# Archiv früherer Events und interne Arbeitsdaten der Bildpipeline
<DirectoryMatch "^/app/data/(archive|render-queue|render-assets)(/|$)">
    Require all denied
</DirectoryMatch>

# Bild-Datenbank, Druckprotokoll, Zähler, Event-Markierung, Sperren und halbfertige Dateien in data/.
# Ausgeliefert werden dort nur Bilder (Galerie, Vorschaubilder, QR-Codes).
<Directory "/app/data">
    <FilesMatch "(\.(txt|csv|count|json|lock)$)|(^\.)">
        Require all denied
    </FilesMatch>
</Directory>
