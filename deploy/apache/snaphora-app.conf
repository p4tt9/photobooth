# Die neue Anwendung app (planning/ARCHITEKTUR.md): Schnittstelle unter /api/v1/.
# Bis Paket 9 steht Apache davor; die Adressen bleiben danach gleich, nur ohne Apache.
# Gleicher Ursprung wie die Gäste-Oberfläche: Cookies ohne CORS, eine Adresse für den Kiosk.
ProxyPreserveHost On
ProxyTimeout 30
ProxyPass        /api/v1/ http://app:3002/api/v1/ retry=1
ProxyPassReverse /api/v1/ http://app:3002/api/v1/
# app setzt das Sitzungs-Cookie nur dann "Secure", wenn der Browser über HTTPS kam
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
