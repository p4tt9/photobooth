# Snaphora USB-Installer (UEFI). Wartet bewusst auf eine Auswahl – nichts startet von allein,
# damit niemand versehentlich eine Festplatte löscht.
set default=0
set timeout=-1

insmod all_video
insmod gfxterm
terminal_output console

menuentry "Snaphora Fotobox installieren  (LOESCHT die interne SSD!)" {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed/snaphora.cfg locale=de_DE.UTF-8 keymap=de --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Abbrechen" {
    exit
}
