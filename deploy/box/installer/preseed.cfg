# Snaphora Fotobox – unbeaufsichtigte Debian-13-Installation.
# Platzhalter @…@ setzt build-iso.sh beim Bauen des USB-Sticks ein.

### Sprache, Tastatur, Zeit
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i time/zone string Europe/Berlin
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Netzwerk (Kabel bevorzugt, sonst WLAN aus build-iso.sh)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string local
d-i netcfg/hostname string @HOSTNAME@
d-i hw-detect/load_firmware boolean true
@WIFI_PRESEED@

### Paketquelle
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

### Benutzer: kein root-Login, Admin mit sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Snaphora Admin
d-i passwd/username string @ADMIN_USER@
d-i passwd/user-password-crypted password @ADMIN_PASSWORD_HASH@
d-i passwd/user-default-groups string sudo plugdev

### Festplatte: interne SSD komplett, ein ext4-System (USB-Stick wird ausgelassen)
d-i partman/early_command string \
    disk=""; \
    for d in $(list-devices disk); do \
        name=$(basename "$d"); \
        if [ "$(cat /sys/block/$name/removable 2>/dev/null)" = "0" ] && ! readlink -f /sys/block/$name | grep -q /usb; then \
            disk="$d"; break; \
        fi; \
    done; \
    [ -n "$disk" ] && debconf-set partman-auto/disk "$disk"; \
    debconf-set grub-installer/bootdev "$disk"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-efi/non_efi_system boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false

### Pakete: nur Grundsystem + SSH, der Rest kommt über provision.sh
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates rsync
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Snaphora-Dateien übernehmen und Ersteinrichtung für den ersten Start vormerken
d-i preseed/late_command string \
    mkdir -p /target/opt/snaphora /target/etc/snaphora; \
    cp -a /cdrom/snaphora/box /target/opt/snaphora/box; \
    cp /cdrom/snaphora/box.env /target/etc/snaphora/box.env; \
    mkdir -p /target/home/@ADMIN_USER@/.ssh; \
    cp /cdrom/snaphora/authorized_keys /target/home/@ADMIN_USER@/.ssh/authorized_keys; \
    in-target chown -R @ADMIN_USER@:@ADMIN_USER@ /home/@ADMIN_USER@/.ssh; \
    in-target chmod 700 /home/@ADMIN_USER@/.ssh; \
    in-target chmod 600 /home/@ADMIN_USER@/.ssh/authorized_keys; \
    cp /target/opt/snaphora/box/host/files/etc/systemd/system/snaphora-firstboot.service /target/etc/systemd/system/; \
    in-target systemctl enable snaphora-firstboot.service

### Abschluss: ohne Rückfrage neu starten
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
