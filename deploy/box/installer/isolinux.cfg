# Snaphora USB-Installer (BIOS/Legacy). Startet erst nach Druck auf Enter.
default snaphora
prompt 1
timeout 0
display snaphora.msg

label snaphora
    kernel /install.amd/vmlinuz
    append auto=true priority=critical preseed/file=/cdrom/preseed/snaphora.cfg locale=de_DE.UTF-8 keymap=de initrd=/install.amd/initrd.gz --- quiet
