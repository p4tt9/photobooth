# Fotobox (ThinkCentre) – Betrieb mit echter Hardware.
#
# Erwartet auf dem Grundsystem:
#   - Docker
#   - CUPS mit eingerichtetem DNP DS620 als Standarddrucker (Socket /run/cups/cups.sock)
#   - udev-Regel host/99-snaphora-camera.rules (Kamera für Gruppe plugdev freigeben)
#   - Kiosk-Browser auf http://localhost
#
# Start:   SNAPHORA_VERSION=<version> docker compose -f deploy/box/compose.yml up -d
#
# Verbindung zum Backend (optional – ohne läuft die Box mit ihren lokalen Einstellungen):
#   SNAPHORA_SERVER_URL=https://...           Adresse des Backends
#   SNAPHORA_REGISTRATION_TOKEN=<token>       Einmal-Token aus dem Management-Frontend
# oder nachträglich: docker compose -f deploy/box/compose.yml exec agent snaphora-agent register <token>
#
# Zugang zur Verwaltung: persönliche PINs kommen vom Server. Für den Fall ohne Server gibt es eine Not-PIN,
# gesetzt mit `sudo snaphora-set-pin` (liegt nur als Hash in /etc/snaphora/admin-pin.hash).
#
# Befehle für Kamera und Drucker sind fest im Image und nicht über Einstellungen änderbar. Abweichungen für
# eine bestimmte Hardware stehen in /etc/snaphora/box.env, z. B. SNAPHORA_COMMAND_PRINT='lp -d DNP_DS620 %s'.

name: snaphora

services:
  photobooth:
    image: ${SNAPHORA_IMAGE:-ghcr.io/p4tt9/photobooth}:${SNAPHORA_VERSION:-dev}
    restart: unless-stopped
    ports:
      # Lokales Netz der Box gilt als vertrauenswürdig (Konzept E4/E16).
      - "80:80"
    # Kamera per USB: /dev/bus/usb als Volume (nicht als `devices`), damit auch eine
    # erst nach dem Start eingesteckte Kamera sichtbar wird. 189 = USB-Geräte.
    device_cgroup_rules:
      - "c 189:* rmw"
    group_add:
      - "46" # plugdev auf Debian/Ubuntu
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      # Verzeichnis statt Socket-Datei: startet der Container vor CUPS, würde Docker
      # sonst an Stelle des Sockets ein leeres Verzeichnis anlegen.
      - /run/cups:/run/cups
      - data:/app/data
      - config:/app/config
      - private:/app/private
      - var:/app/var
    environment:
      SNAPHORA_APP_URL: http://app:3002
      # Leer = Standard aus dem Image
      SNAPHORA_COMMAND_PRINT: ${SNAPHORA_COMMAND_PRINT:-}
      SNAPHORA_COMMAND_TAKE_PICTURE: ${SNAPHORA_COMMAND_TAKE_PICTURE:-}
      SNAPHORA_COMMAND_TAKE_COLLAGE: ${SNAPHORA_COMMAND_TAKE_COLLAGE:-}
      SNAPHORA_COMMAND_TAKE_CUSTOM: ${SNAPHORA_COMMAND_TAKE_CUSTOM:-}
      SNAPHORA_COMMAND_PREVIEW: ${SNAPHORA_COMMAND_PREVIEW:-}
      SNAPHORA_COMMAND_PRE_PHOTO: ${SNAPHORA_COMMAND_PRE_PHOTO:-}
      SNAPHORA_COMMAND_POST_PHOTO: ${SNAPHORA_COMMAND_POST_PHOTO:-}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  render:
    image: ${SNAPHORA_RENDER_IMAGE:-ghcr.io/p4tt9/photobooth-render}:${SNAPHORA_VERSION:-dev}
    restart: unless-stopped
    volumes:
      - data:/data
      - looks:/looks:ro
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Die Snaphora-Box-Anwendung: Verwaltung, Zugang mit PIN, Einstellungen, Druckkontingent, Status.
  # Nicht nach außen veröffentlicht – erreichbar über die App unter /api/v1/.
  app:
    image: ${SNAPHORA_APP_IMAGE:-ghcr.io/p4tt9/photobooth-app}:${SNAPHORA_VERSION:-dev}
    restart: unless-stopped
    environment:
      AGENT_URL: http://agent:3001
      RENDER_URL: http://render:3000
      # Kamera und Drucker für den Selbsttest – bis Paket 8/9 noch in der bisherigen App
      PHOTOBOOTH_URL: http://photobooth
      PHOTOBOOTH_VAR_DIR: /photobooth-var
      ADMIN_PIN_HASH_FILE: /run/secrets/admin-pin-hash
      APP_VERSION: ${SNAPHORA_VERSION:-dev}
    secrets:
      - admin-pin-hash
    volumes:
      - config:/config
      - data:/data:ro
      # Bilder und Schriften der Gestaltung (app besitzt die Upload-Ordner)
      - private:/private
      # Protokoll der bisherigen App (nur lesen)
      - var:/photobooth-var:ro
      # Zugriffsprotokoll und Sperrzustand
      - app:/state
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agent:
    image: ${SNAPHORA_AGENT_IMAGE:-ghcr.io/p4tt9/photobooth-agent}:${SNAPHORA_VERSION:-dev}
    restart: unless-stopped
    # Erst die App: sie legt die gemeinsamen Volumes mit ihren Inhalten an
    depends_on:
      - photobooth
    environment:
      SERVER_URL: ${SNAPHORA_SERVER_URL:-}
      REGISTRATION_TOKEN: ${SNAPHORA_REGISTRATION_TOKEN:-}
      APP_VERSION: ${SNAPHORA_VERSION:-dev}
    volumes:
      # Zugangsdaten der Box liegen nur hier, nicht in der App
      - agent:/agent
      - data:/data:ro
      - config:/config
      - private:/private
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  admin-pin-hash:
    # Legt die Provisionierung an (leer, bis eine Not-PIN gesetzt ist); gehört Benutzer 1000, Rechte 400
    file: /etc/snaphora/admin-pin.hash

volumes:
  data:
  config:
  private:
  var:
  looks:
  agent:
  app:
