# Entwicklung auf dem Laptop – ohne Kamera, Drucker und Ringlicht.
#
#   docker compose up --build        → Fotobox auf http://localhost:8080
#
# Statt echter Hardware laufen Simulatoren:
#   Kamera     → deploy/dev/fake-gphoto2 (Beispielfotos in 750D-Auflösung)
#   Drucker    → deploy/dev/fake-lp       (Druckaufträge landen in .dev/printer/)
#   Ringlicht  → deploy/dev/mock-esp      (http://localhost:8081, Protokoll unter /_log)
#   Backend    → deploy/dev/mock-backend  (http://localhost:8082, Übersicht mit hochgeladenen Fotos)
#
# Verwaltung: http://localhost:8080/login/ mit der Dev-PIN 246810 (Not-PIN, gilt nur in dieser Umgebung).
# Schnittstelle von app: http://localhost:8080/api/v1/ (über Apache, wie auf der Box).
#
# Der Agent registriert sich beim Start mit DEV-TOKEN am Mock-Backend. Ein Beispiel-Event (Titel, Rahmen,
# Druckkontingent, Online-Galerie) schaltet `node deploy/dev/mock-backend/demo-event.mjs an` ein (`aus` beendet es).
#
# Looks (Bearbeitungs-Presets) liegen in .dev/looks/<name>/ und werden in der Admin-Oberfläche gewählt.
#
# Fehler simulieren: Datei in .dev/devices/ anlegen (camera-disconnected, camera-busy, printer-offline).
# Die Box selbst nutzt deploy/box/compose.yml.

name: snaphora-dev

services:
  photobooth:
    build:
      context: .
      target: dev
      args:
        APP_VERSION: dev
    ports:
      - "8080:80"
    environment:
      FAKE_CAMERA_DELAY: "1.8"
    volumes:
      - data:/app/data
      - config:/app/config
      - private:/app/private
      - var:/app/var
      - ./.dev/printer:/var/spool/fake-printer
      - ./.dev/devices:/var/lib/fake-devices
    restart: unless-stopped

  # Bildpipeline (TypeScript/libvips): Look, Anzeige sofort, Galerie- und Druckbild im Hintergrund
  render:
    build:
      context: box
      target: render
    volumes:
      - data:/data
      - ./.dev/looks:/looks:ro
    restart: unless-stopped

  # Verbindung zum Backend: Konfiguration vom Server, Galerie-Upload
  agent:
    build:
      context: box
      target: agent
    depends_on:
      - photobooth
    environment:
      SERVER_URL: http://mock-backend:8082
      # Nur in der Entwicklung: Mock-Backend ohne TLS. Auf der Box muss der Server https:// sprechen.
      ALLOW_INSECURE_HTTP: "1"
      REGISTRATION_TOKEN: DEV-TOKEN
      SYNC_INTERVAL: "10"
      SCAN_INTERVAL: "2"
    ports:
      - "127.0.0.1:8083:3001"
    volumes:
      - agent:/agent
      - data:/data:ro
      - config:/config
      - private:/private
    restart: unless-stopped

  # Die Snaphora-Box-Anwendung (NestJS): Einstellungen, Zugang mit PIN, Druckkontingent, Status
  app:
    build:
      context: box
      target: app
      args:
        APP_VERSION: dev
    environment:
      AGENT_URL: http://agent:3001
      RENDER_URL: http://render:3000
      # Kamera und Drucker für den Selbsttest – bis Paket 8/9 noch in der bisherigen App
      PHOTOBOOTH_URL: http://photobooth
      # Dev-PIN 246810 – nur für die Entwicklung. Auf der Box setzt die Provisionierung eine eigene Not-PIN.
      ADMIN_PIN_HASH: "scrypt$$16384$$8$$1$$jxTjFn4hTVY1CZyuI5O4Dg==$$xXjlu3eVcIpOix7mJCIqZsjQlj+tbNoX/TJeULserq8="
    volumes:
      - config:/config
      - data:/data:ro
      # Bilder und Schriften der Gestaltung (app besitzt die Upload-Ordner)
      - private:/private
      - app:/state
    restart: unless-stopped

  mock-backend:
    image: node:24.22-bookworm-slim
    command: ["node", "/srv/server.mjs"]
    environment:
      MOCK_SEED_TOKEN: DEV-TOKEN
      MOCK_PUBLIC_URL: http://mock-backend:8082
      MOCK_DATA_DIR: /state
    volumes:
      - ./deploy/dev/mock-backend:/srv:ro
      - mock-backend:/state
    ports:
      - "8082:8082"
    restart: unless-stopped

  ringlight:
    image: node:24.22-bookworm-slim
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./deploy/dev/mock-esp:/srv:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  data:
  config:
  private:
  var:
  agent:
  app:
  mock-backend:
