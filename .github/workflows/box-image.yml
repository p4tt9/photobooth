name: Fotobox-Image

on:
  push:
    branches:
      - dev
      - 'snaphora/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: box-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/photobooth

jobs:
  test:
    name: Smoke-Test mit Simulatoren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Dev-Umgebung bauen und starten
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Foto auslösen, verarbeiten, drucken
        run: RUNS=3 node tests/smoke/capture-print.mjs

      - name: Ringlicht-Simulator erreichbar
        run: curl --fail-with-body http://localhost:8081/_log

      - name: Selbstreparatur beschädigter Dateien (Datenbank, Druckzähler, Konfiguration)
        run: node tests/crash/damaged-files.mjs

      - name: Absturztest (App mitten im Ablauf hart beenden)
        run: ITERATIONS=8 node tests/crash/power-cut.mjs

      - name: Oberflächentests im Browser (Playwright)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Container-Logs
        if: always()
        run: docker compose logs

  publish:
    name: Image für die Box veröffentlichen
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }} (${{ github.sha }})
          cache-from: type=gha
          cache-to: type=gha,mode=max
