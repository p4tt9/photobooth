name: Fotobox-Image

on:
  push:
    branches:
      - dev
      - 'snaphora/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: box-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/photobooth

jobs:
  test:
    name: Smoke-Test mit Simulatoren
    # Fest auf 24.04: ubuntu-latest wechselt gerade auf 26.04, das Playwright noch nicht unterstützt
    runs-on: ubuntu-24.04
    # Ein hängender Schritt soll schnell und mit Namen scheitern statt stundenlang zu laufen
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Render-Dienst testen
        timeout-minutes: 5
        working-directory: services/render
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Dev-Umgebung bauen und starten
        timeout-minutes: 12
        run: mkdir -p .dev/looks .dev/printer .dev/devices && docker compose up -d --build --wait --wait-timeout 180

      - name: Foto auslösen, verarbeiten, drucken
        timeout-minutes: 3
        run: RUNS=3 node tests/smoke/capture-print.mjs

      - name: Ringlicht-Simulator erreichbar
        run: curl --fail-with-body http://localhost:8081/_log

      - name: Selbstreparatur beschädigter Dateien (Datenbank, Druckzähler, Konfiguration)
        timeout-minutes: 5
        run: node tests/crash/damaged-files.mjs

      - name: Absturztest (App mitten im Ablauf hart beenden)
        timeout-minutes: 10
        run: ITERATIONS=8 node tests/crash/power-cut.mjs

      - name: Oberflächentests im Browser (Playwright)
        timeout-minutes: 12
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund || { echo "::error title=Oberflächentests::npm ci fehlgeschlagen"; exit 1; }
          npx playwright install --with-deps chromium || { echo "::error title=Oberflächentests::Browser-Installation fehlgeschlagen"; exit 1; }
          npx playwright test || { echo "::error title=Oberflächentests::Tests fehlgeschlagen (Details in den Annotationen darüber)"; exit 1; }

      - name: Playwright-Bericht bei Fehlern
        if: failure()
        run: |
          for f in tests/e2e/test-results/*/error-context.md; do
            [ -f "$f" ] && echo "::error title=Playwright $(basename "$(dirname "$f")")::$(head -c 3000 "$f" | tr '\n' ' ')"
          done
          true

      - name: Container-Logs
        if: always()
        run: docker compose logs

  publish:
    name: Image für die Box veröffentlichen
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }} (${{ github.sha }})
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: meta-render
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}-render
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: services/render
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-render.outputs.tags }}
          labels: ${{ steps.meta-render.outputs.labels }}
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render
